# Configuration nginx pour l'export statique de Next.js.
# Les pages sont exportées en `page.html` (pas de dossier `page/index.html`),
# d'où le try_files `$uri` puis `$uri.html`.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Le reverse proxy de Coolify (Traefik) gère le HTTPS ; on garde des
    # redirections relatives pour ne pas exposer le port 80 interne.
    absolute_redirect off;

    server_tokens off;
    charset utf-8;

    # ---------------------------------------------------------------- compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ---------------------------------------------------------------- sécurité
    # (déclarés au niveau `server` pour être hérités par tous les `location`
    #  qui n'ajoutent pas eux-mêmes de `add_header`)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

    # ---------------------------------------------------------------- URL propres
    # /presentation/ -> /presentation  (les fichiers exportés sont `presentation.html`)
    rewrite ^/(.+)/$ /$1 permanent;

    # ---------------------------------------------------------------- endpoints
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets Next.js : noms hachés -> cache immuable
    location /_next/static/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # Photos WebP générées par scripts/optimize-images.mjs (noms stables)
    location /photos/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------- pages
    location / {
        # Le HTML doit toujours être revalidé pour que les nouveaux déploiements
        # soient visibles immédiatement.
        expires -1;
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
